name: MiUnlockTool Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish tagged APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 37
        run: sdkmanager --install "platforms;android-37.0"

      - name: Setup Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
          validate-wrappers: false

      - name: Audit source integrity
        run: python3 tools/verify_source.py

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace --max-workers=2 :app:testDebugUnitTest

      - name: Build release APK
        run: gradle --no-daemon --stacktrace --max-workers=2 :app:assembleRelease

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk/release -type f -name '*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"
          sha256sum dist/*.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Mi Unlock Tool ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Automated Android APK build.
            Signed with the repository's existing shared Android debug keystore to preserve APK upgrade compatibility.
            This shared debug key is not suitable as a production-private signing identity.
          files: dist/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
