name: MiTool Auto Build and Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mitool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Python Validation and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Install test and build tools
        run: |
          python -m pip install pytest build

      - name: Validate Python
        run: python -m compileall -q .

      - name: Run tests
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -q
          elif [ -f test.py ]; then
            python test.py
          else
            echo "No test suite found."
          fi

      - name: Build package
        shell: bash
        run: |
          mkdir -p dist
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            python -m build --outdir dist
          else
            zip -r dist/MiTool-source.zip . \
              -x ".git/*" ".github/*" \
                 "*/__pycache__/*" "*.pyc" \
                 ".venv/*" "venv/*"
          fi
          test -n "$(find dist -type f -print -quit)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiTool-build
          path: dist/
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: MiTool-build
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mitool-build-${{ github.run_number }}
          name: MiTool Automated Build #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
